name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml tests/unit/

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  benchmark-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run fast guided benchmark
        run: |
          python3 -m prism.benchmarks.run_benchmark --depths 5 --distractors 0 --repeats 1 --max-steps 80 --guided

  integration-tests:
    name: MeTTa & PLN Integration Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/patham9/petta-ci:latest
    steps:
      - name: Install git and bash tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: prism

      - name: Set up PeTTa and PLN
        run: |
          chmod +x prism/scripts/setup_petta.sh
          ./prism/scripts/setup_petta.sh

      - name: Run MeTTa PRISM Integration Suite
        run: |
          cd PeTTa
          echo "Running test_depth_penalty.metta..."
          sh run.sh ../prism/tests/integration/test_depth_penalty.metta
          echo "Running test_stage0_metta.metta..."
          sh run.sh ../prism/tests/integration/test_stage0_metta.metta
          echo "Running test_fallback.metta..."
          sh run.sh ../prism/tests/integration/test_fallback.metta
          echo "Running test_prism_hook.metta..."
          sh run.sh ../prism/tests/integration/test_prism_hook.metta

      - name: Run PLN Upstream Regression Suite
        run: |
          cd PeTTa
          echo "Verifying 7/7 PLN rule tests..."
          for f in ./repos/PLN/ruletests/*.metta; do
            echo -n "$f: "
            sh run.sh "$f" | grep "should" || exit 1
          done
